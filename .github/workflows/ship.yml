name: ship
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  sign-off:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "Signed off."
  package:
    needs: [sign-off]
    runs-on: ubuntu-latest
    steps:
      - env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" | sha256sum
